<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundial 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f3;--card:#fff;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --accent:#2563eb;--accent-bg:#eff6ff;--accent-text:#1e40af;
  --success:#16a34a;--success-bg:#f0fdf4;--success-text:#15803d;
  --warn:#d97706;--warn-bg:#fffbeb;--warn-text:#92400e;
  --danger:#dc2626;--danger-bg:#fef2f2;--danger-text:#991b1b;
  --r:8px;--rl:12px;--rxl:16px;--f:'Segoe UI',system-ui,sans-serif;
}
body{font-family:var(--f);background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:12px}
/* NAV */
.nav{display:flex;gap:5px;background:var(--card);border:0.5px solid var(--border);border-radius:var(--rl);padding:5px;margin-bottom:14px;flex-wrap:wrap}
.nb{flex:1;min-width:70px;padding:7px 8px;border:none;background:transparent;border-radius:var(--r);cursor:pointer;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;justify-content:center;font-family:var(--f);transition:background .15s}
.nb.active,.nb:hover{background:var(--bg);color:var(--text);font-weight:500}
.page{display:none}.page.active{display:block}
/* CREDITS BAR */
.cbar{display:flex;align-items:center;gap:10px;background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;flex-wrap:wrap}
.cval{font-size:22px;font-weight:600}
.clbl{font-size:11px;color:var(--text2)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 10px;border:0.5px solid var(--border);border-radius:20px;cursor:pointer;font-size:12px;color:var(--text2);background:var(--card);font-family:var(--f)}
.chip.active{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent)}
/* ALBUM */
.cat{background:var(--card);border:0.5px solid var(--border);border-radius:var(--rl);margin-bottom:10px;overflow:hidden}
.cath{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.cath:hover{background:var(--bg)}
.catb{display:none;padding:0 14px 14px}.catb.open{display:block}
.subcat{border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.subcath{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;background:var(--bg)}
.subcatb{display:none;padding:8px 10px}.subcatb.open{display:block}
.badge{font-size:10px;padding:2px 8px;border-radius:20px}
.bg{background:#fef3c7;color:#92400e}.bb{background:var(--accent-bg);color:var(--accent-text)}
.chv{transition:transform .2s;font-size:13px;color:var(--text3)}.chv.open{transform:rotate(180deg)}
/* CROMO */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.cromo{border:0.5px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s;background:var(--card)}
.cromo:hover{transform:translateY(-2px)}
.ccover{width:100%;aspect-ratio:2/3;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;position:relative}
.ccover img{width:100%;height:100%;object-fit:cover}
.cfoot{padding:5px 6px;text-align:center}
/* APUESTAS */
.bets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.bc{background:var(--card);border:0.5px solid var(--border);border-radius:var(--rl);padding:10px}
.sinp{width:40px;text-align:center;padding:5px;font-size:14px;font-weight:700;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:var(--f)}
.sinp:focus{outline:none;border-color:var(--accent)}
.cbtn{width:100%;padding:6px;border:0.5px solid var(--border2);border-radius:var(--r);background:transparent;cursor:pointer;font-size:11px;color:var(--text2);font-family:var(--f)}
.cbtn.done{color:var(--success);border-color:var(--success);cursor:default}
/* PLANTILLA */
.pitch-wrap{background:var(--card);border:0.5px solid var(--border);border-radius:var(--rl);padding:12px}
.bench-wrap{background:var(--card);border:0.5px solid var(--border);border-radius:var(--rl);padding:12px;margin-top:10px}
.bench-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bp{display:flex;align-items:center;gap:5px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);padding:4px 8px;font-size:11px;cursor:pointer}
.bp:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text)}
.bp img{width:20px;height:20px;border-radius:50%;object-fit:cover}
/* ADMIN */
.asec{background:var(--card);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:10px}
.fr{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.fr input,.fr select{flex:1;min-width:90px;padding:7px 9px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-size:12px;font-family:var(--f)}
.btn{padding:6px 12px;border:0.5px solid var(--border2);border-radius:var(--r);background:transparent;cursor:pointer;font-size:12px;color:var(--text2);font-family:var(--f);white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent)}
.btn.d{background:var(--danger-bg);color:var(--danger-text);border-color:var(--danger)}
.btn.s{background:var(--success-bg);color:var(--success-text);border-color:var(--success)}
.btn.w{background:var(--warn-bg);color:var(--warn-text);border-color:var(--warn)}
.ri{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:12px}
.ri:last-child{border:none}
.tabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:5px 11px;border:0.5px solid var(--border);border-radius:20px;background:transparent;cursor:pointer;font-size:12px;color:var(--text2);font-family:var(--f)}
.tab.active{background:var(--bg);color:var(--text);font-weight:500}
.pe{display:flex;gap:5px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.pe input{flex:1;min-width:70px;padding:5px 7px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-size:11px;font-family:var(--f)}
.pt{width:28px;height:28px;border-radius:4px;object-fit:cover;border:0.5px solid var(--border);flex-shrink:0}
/* MODAL */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;padding:16px}
.mo.open{display:flex}
.mb{background:var(--card);border-radius:var(--rxl);padding:20px;max-width:400px;width:100%;max-height:85vh;overflow-y:auto}
.mb h3{font-size:16px;font-weight:600;margin-bottom:8px}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mbtns .btn{flex:1}
.mcover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:var(--r);margin-bottom:10px;background:var(--bg);display:block;max-height:200px}
.mplayers{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-bottom:10px}
.mplayer{border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden;text-align:center}
.mplayer img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg);display:block}
.mplayer-n{font-size:10px;padding:3px;color:var(--text2)}
/* SYNC */
.sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:6px 12px;margin-bottom:10px}
.sd{width:8px;height:8px;border-radius:50%;background:var(--text3);display:inline-block;flex-shrink:0}
.sd.ok{background:var(--success)}.sd.err{background:var(--danger)}.sd.ld{background:var(--warn);animation:pulse 1s infinite}
/* BUCKET */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:7px}
.bi{border:1.5px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;background:var(--card);position:relative}
.bi.sel{border-color:var(--accent)}.bi.added{border-color:var(--success)}
.bi img{width:100%;aspect-ratio:1;object-fit:cover;background:#111;display:block}
.bi-n{font-size:10px;padding:3px 5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* INFO */
.ibox{background:var(--accent-bg);border:0.5px solid var(--accent);border-radius:var(--r);padding:8px 12px;margin-bottom:10px;font-size:12px;color:var(--accent-text)}
.empty{text-align:center;padding:20px;color:var(--text3);font-size:12px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media(max-width:500px){.cgrid{grid-template-columns:repeat(auto-fill,minmax(85px,1fr))}}
</style>
</head>
<body>
<div class="app">

<div class="sync">
  <span class="sd ld" id="sdot"></span>
  <span id="slbl">Iniciando…</span>
  <span style="margin-left:auto;font-size:10px;color:var(--text3)" id="stime"></span>
</div>

<div class="nav">
  <button class="nb active" id="nav-album"    onclick="showPage('album')"><i class="ti ti-cards"></i> Álbum</button>
  <button class="nb"        id="nav-apuestas" onclick="showPage('apuestas')"><i class="ti ti-trophy"></i> Apuestas</button>
  <button class="nb"        id="nav-plantilla"onclick="showPage('plantilla')"><i class="ti ti-users"></i> Plantilla</button>
  <button class="nb"        id="nav-admin"    onclick="requestAdmin()"><i class="ti ti-settings"></i> Admin</button>
  <button class="nb"        style="flex:none;padding:7px 10px" onclick="openShare()"><i class="ti ti-share"></i></button>
</div>

<!-- ÁLBUM -->
<div id="page-album" class="page active">
  <div class="cbar">
    <i class="ti ti-coin" style="font-size:20px;color:var(--text2)"></i>
    <div><div class="cval" id="cr-album">0</div><div class="clbl">créditos</div></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:12px;color:var(--text2)">Jugador:</span>
      <div class="chips" id="uc-album"></div>
    </div>
  </div>
  <div id="album-content"></div>
</div>

<!-- APUESTAS -->
<div id="page-apuestas" class="page">
  <div class="cbar">
    <i class="ti ti-coin" style="font-size:20px;color:var(--text2)"></i>
    <div><div class="cval" id="cr-bets">0</div><div class="clbl">créditos</div></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:12px;color:var(--text2)">Jugador:</span>
      <div class="chips" id="uc-bets"></div>
    </div>
  </div>
  <div class="ibox"><i class="ti ti-info-circle"></i> Confirmada: <strong>+1 cr.</strong> · Signo: <strong>+1 cr.</strong> · Exacto: <strong>+3 cr.</strong> · Signo calculado automáticamente. Solo admin puede modificar porras ya enviadas.</div>
  <div id="matches-list" class="bets-grid"></div>
</div>

<!-- PLANTILLA -->
<div id="page-plantilla" class="page">
  <div class="cbar">
    <i class="ti ti-coin" style="font-size:20px;color:var(--text2)"></i>
    <div><div class="cval" id="cr-plantilla">0</div><div class="clbl">créditos</div></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:12px;color:var(--text2)">Jugador:</span>
      <div class="chips" id="uc-plantilla"></div>
    </div>
  </div>
  <div class="pitch-wrap">
    <svg id="pitch-svg" viewBox="0 0 420 400" style="width:100%;height:400px;display:block">
      <rect x="8" y="4" width="404" height="392" rx="10" fill="#1a6b2f" stroke="#2d8f45" stroke-width="1.5"/>
      <rect x="36" y="28" width="348" height="344" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
      <line x1="36" y1="200" x2="384" y2="200" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
      <circle cx="210" cy="200" r="44" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
      <rect x="160" y="28" width="100" height="40" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
      <rect x="160" y="332" width="100" height="40" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
    </svg>
  </div>
  <div class="bench-wrap">
    <div style="font-size:12px;font-weight:500;color:var(--text2)"><i class="ti ti-armchair"></i> Suplentes — pulsa para asignar posición</div>
    <div class="bench-grid" id="bench-grid"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="page-admin" class="page">
  <div class="tabs">
    <button class="tab active" id="atab-cards"   onclick="showATab('cards')">Cromos</button>
    <button class="tab"        id="atab-bucket"  onclick="showATab('bucket')">📦 Bucket</button>
    <button class="tab"        id="atab-matches" onclick="showATab('matches')">Partidos</button>
    <button class="tab"        id="atab-results" onclick="showATab('results')">Resultados</button>
    <button class="tab"        id="atab-users"   onclick="showATab('users')">Participantes</button>
    <button class="tab"        id="atab-revert"  onclick="showATab('revert')">Revertir</button>
  </div>

  <!-- CROMOS -->
  <div id="admin-cards">
    <div class="asec">
      <div style="font-size:14px;font-weight:500;margin-bottom:10px">Añadir cromo</div>
      <div class="fr">
        <input id="cn" placeholder="Título del cromo">
        <select id="cc">
          <option value="packs_basicos">Packs básicos (10 cr.)</option>
          <option value="leyenda">Leyenda (20 cr.)</option>
          <option value="tridente">Tridente (20 cr.)</option>
          <option value="club_bavaros">Bávaros (15 cr.)</option>
          <option value="club_gunners">Gunners (15 cr.)</option>
          <option value="club_reds">Reds (15 cr.)</option>
          <option value="espana_0">España 0 (10 cr.)</option>
          <option value="espana_5">España +5 (15 cr.)</option>
          <option value="espana_10">España +10 (20 cr.)</option>
          <option value="promesa_0">Promesa 0 (10 cr.)</option>
          <option value="promesa_5">Promesa +5 (15 cr.)</option>
          <option value="promesa_10">Promesa +10 (20 cr.)</option>
          <option value="pos_cattenaccio_0">Cattenaccio (10 cr.)</option>
          <option value="pos_cattenaccio_5">Cattenaccio +5 (15 cr.)</option>
          <option value="pos_muro">Muro Berlín (15 cr.)</option>
          <option value="pos_mariscal">Mariscal (20 cr.)</option>
          <option value="pos_transiciones_5">Transiciones +5 (15 cr.)</option>
          <option value="pos_transiciones_10">Transiciones +10 (20 cr.)</option>
          <option value="pos_killers">Killers (20 cr.)</option>
          <option value="estrella_0">Estrella 0 (20 cr.)</option>
          <option value="estrella_10">Estrella +10 (30 cr.)</option>
          <option value="estrella_25">Estrella +25 (45 cr.)</option>
        </select>
      </div>
      <div class="fr">
        <input id="cimg" type="url" placeholder="URL portada (bucket Supabase)" oninput="prevCover(this.value,'cprev')">
        <button class="btn" onclick="document.getElementById('cimg').value='';document.getElementById('cprev').style.display='none'"><i class="ti ti-x"></i></button>
      </div>
      <img id="cprev" style="display:none;max-height:80px;border-radius:6px;margin-bottom:8px;object-fit:cover">
      <div style="font-size:12px;color:var(--text2);margin-bottom:6px">Jugadores <span style="font-weight:400">(nombre · posición · URL imagen)</span></div>
      <div id="ped"></div>
      <button class="btn" style="margin-bottom:8px" onclick="addPRow('ped')"><i class="ti ti-user-plus"></i> Añadir jugador</button>
      <div class="fr"><button class="btn p" onclick="saveCard()"><i class="ti ti-plus"></i> Guardar cromo</button></div>
    </div>
    <div class="asec">
      <div style="font-size:14px;font-weight:500;margin-bottom:10px">Cromos cargados</div>
      <div id="aclist"></div>
    </div>
  </div>

  <!-- BUCKET -->
  <div id="admin-bucket" style="display:none">
    <div class="asec">
      <div style="font-size:14px;font-weight:500;margin-bottom:8px">Importar desde bucket <code style="background:var(--bg);padding:2px 6px;border-radius:4px">cromos</code></div>
      <div class="fr" style="align-items:center">
        <select id="bfolder">
          <option value="">— Carpeta / categoría —</option>
          <option value="packs_basicos">packs_basicos</option><option value="leyenda">leyenda</option>
          <option value="tridente">tridente</option><option value="club_bavaros">club_bavaros</option>
          <option value="club_gunners">club_gunners</option><option value="club_reds">club_reds</option>
          <option value="espana_0">espana_0</option><option value="espana_5">espana_5</option>
          <option value="espana_10">espana_10</option><option value="promesa_0">promesa_0</option>
          <option value="promesa_5">promesa_5</option><option value="promesa_10">promesa_10</option>
          <option value="pos_cattenaccio_0">pos_cattenaccio_0</option><option value="pos_cattenaccio_5">pos_cattenaccio_5</option>
          <option value="pos_muro">pos_muro</option><option value="pos_mariscal">pos_mariscal</option>
          <option value="pos_transiciones_5">pos_transiciones_5</option><option value="pos_transiciones_10">pos_transiciones_10</option>
          <option value="pos_killers">pos_killers</option><option value="estrella_0">estrella_0</option>
          <option value="estrella_10">estrella_10</option><option value="estrella_25">estrella_25</option>
        </select>
        <button class="btn p" onclick="listBucket()"><i class="ti ti-folder-open"></i> Listar</button>
      </div>
      <div id="bstatus" style="font-size:12px;color:var(--text2);min-height:18px;margin-bottom:6px"></div>
      <div id="bgrid" class="bgrid"></div>
      <div id="bactions" style="display:none;margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span id="bsel" style="font-size:12px;color:var(--text2);flex:1"></span>
        <button class="btn" onclick="toggleSelAll()">Sel. todo</button>
        <button class="btn s" onclick="importBucket()"><i class="ti ti-download"></i> Importar</button>
      </div>
    </div>
  </div>

  <!-- PARTIDOS -->
  <div id="admin-matches" style="display:none">
    <div class="asec">
      <div style="font-size:14px;font-weight:500;margin-bottom:10px">Partidos</div>
      <div class="fr">
        <input id="mg" placeholder="Grupo"><input id="mh" placeholder="Local">
        <input id="ma" placeholder="Visitante"><input id="md" placeholder="Fecha">
      </div>
      <div class="fr"><button class="btn p" onclick="addMatch()"><i class="ti ti-plus"></i> Añadir</button></div>
      <div id="amlist" style="max-height:400px;overflow-y:auto;margin-top:8px"></div>
    </div>
  </div>

  <!-- RESULTADOS -->
  <div id="admin-results" style="display:none">
    <div class="asec">
      <div style="font-size:14px;font-weight:500;margin-bottom:4px">Resultados</div>
      <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Editables en cualquier momento. El signo 1/X/2 se calcula automáticamente.</p>
      <div id="rlist" style="max-height:600px;overflow-y:auto"></div>
    </div>
  </div>

  <!-- USUARIOS -->
  <div id="admin-users" style="display:none">
    <div class="asec">
      <div style="font-size:14px;font-weight:500;margin-bottom:10px">Participantes</div>
      <div class="fr">
        <input id="nuname" placeholder="Nombre">
        <button class="btn p" onclick="addUser()"><i class="ti ti-user-plus"></i> Añadir</button>
      </div>
      <div id="aulist"></div>
    </div>
  </div>

  <!-- REVERTIR -->
  <div id="admin-revert" style="display:none">
    <div class="asec">
      <div style="font-size:14px;font-weight:500;margin-bottom:10px">Historial desbloqueos</div>
      <div id="rvlist"></div>
    </div>
  </div>
</div>

<div class="mo" id="modal"><div class="mb" id="mbox"></div></div>
<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;white-space:nowrap"></div>

<script>
'use strict';

// ── CONFIG ──────────────────────────────────────────────────────────
const SB_URL = 'https://zblnopxcnsuuekrqqwkd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpibG5vcHhjbnN1dWVrcnFxd2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTk1NzAsImV4cCI6MjA5NjA3NTU3MH0.PtwRge6Sz8Qm2q87olzS2UgY05jomhLaRX1PG-lK-Lw';
