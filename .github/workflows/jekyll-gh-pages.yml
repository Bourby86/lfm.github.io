// ── STORAGE ADAPTER ──────────────────────────────────────────────────
const store = {
  async get(k) {
    if (typeof window.storage !== 'undefined') {
      try { const r = await window.storage.get(k, true); return r?.value ?? null; } catch(_) {}
    }
    try { return localStorage.getItem(k); } catch(_) { return null; }
  },
  async set(k, v) {
    if (typeof window.storage !== 'undefined') {
      try { await window.storage.set(k, v, true); return; } catch(_) {}
    }
    try { localStorage.setItem(k, v); } catch(_) {}
  }
};

