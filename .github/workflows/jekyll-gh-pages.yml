// ── ÁLBUM ────────────────────────────────────────────────────────────
function renderAlbum() {
  buildChips('uc-album', renderAlbum);
  const wrap = document.getElementById('album-content'); wrap.innerHTML = '';
  const unl  = S.unlocked[S.cur] || [];
  renderPacks(wrap, unl);
  renderSimple(wrap,'leyenda','Leyenda','🏆','bg',unl);
  renderSimple(wrap,'tridente','Tridente','⚡','bg',unl);
  Object.keys(PARENTS).forEach(pk => renderParent(wrap, pk, unl));
}
function renderPacks(wrap, unl) {
  const cards = S.cards.filter(c => c.cat==='packs_basicos');
  const owned = S.packOwned[S.cur];
  const blk   = mkCatBlock('📦','Packs básicos','10 cr.','bg');
  const body  = blk.querySelector('.catb');
  if (cards.length) body.appendChild(mkGrid(cards, unl));
  else body.innerHTML = '<div class="empty">Sin cromos</div>';
  if (!owned) {
    const btn = document.createElement('button'); btn.className='btn p'; btn.style.cssText='width:100%;margin-top:8px';
    btn.innerHTML='<i class="ti ti-package"></i> Pack completo · 10 cr.'; btn.onclick = buyPack;
    body.appendChild(btn);
  } else body.insertAdjacentHTML('beforeend','<div style="margin-top:6px;font-size:12px;color:var(--success)"><i class="ti ti-check"></i> Pack adquirido</div>');
  wrap.appendChild(blk);
}
function renderSimple(wrap, cat, lbl, icon, bc, unl) {
  const cards = S.cards.filter(c => c.cat===cat);
  const blk   = mkCatBlock(icon, lbl, catCost(cat)+' cr.', bc);
  const body  = blk.querySelector('.catb');
  if (cards.length) body.appendChild(mkGrid(cards, unl));
  else body.innerHTML = '<div class="empty">Sin cromos</div>';
  wrap.appendChild(blk);
}
function renderParent(wrap, pk, unl) {
  const p    = PARENTS[pk];
  const blk  = mkCatBlock(p.icon, p.label, '', 'bb');
  const body = blk.querySelector('.catb');
  Object.entries(CATS).filter(([,v]) => v.parent===pk).forEach(([ck, cat]) => {
    const cards = S.cards.filter(c => c.cat===ck);
    const sb    = document.createElement('div'); sb.className='subcat';
    const hdr   = document.createElement('div'); hdr.className='subcath';
    hdr.innerHTML = `<span style="flex:1;font-size:13px">${cat.label}</span><span class="badge bb">${cat.base+cat.sub} cr.</span><i class="ti ti-chevron-down chv"></i>`;
    hdr.onclick = function() {
      const bd = this.nextElementSibling;
      bd.classList.toggle('open');
      this.querySelector('.chv').classList.toggle('open', bd.classList.contains('open'));
    };
    const bd = document.createElement('div'); bd.className='subcatb';
    if (cards.length) bd.appendChild(mkGrid(cards, unl));
    else bd.innerHTML = '<div class="empty">Sin cromos</div>';
    sb.appendChild(hdr); sb.appendChild(bd); body.appendChild(sb);
  });
  wrap.appendChild(blk);
}
function mkGrid(cards, unl) {
  const g = document.createElement('div'); g.className='cgrid';
  cards.forEach(c => {
    const el = mkCromo(c, unl.includes(c.id));
    el.onclick = () => onCromoClick(c, unl.includes(c.id));
    g.appendChild(el);
  });
  return g;
}
function mkCatBlock(icon, title, badge, bc) {
  const b = document.createElement('div'); b.className='cat';
  b.innerHTML = `<div class="cath"><span style="font-size:20px;width:28px;text-align:center">${icon}</span><span style="font-size:14px;font-weight:500;flex:1">${title}</span>${badge?`<span class="badge ${bc}">${badge}</span>`:''}<i class="ti ti-chevron-down chv"></i></div><div class="catb"></div>`;
  b.querySelector('.cath').onclick = function() {
    const bd = this.nextElementSibling;
    bd.classList.toggle('open');
    this.querySelector('.chv').classList.toggle('open', bd.classList.contains('open'));
  };
  return b;
}
function mkCromo(card, unlocked) {
  const el   = document.createElement('div');
  const cost = catCost(card.cat);
  const anyOwned = S.users.some(u => (S.unlocked[u]||[]).includes(card.id));
  if (unlocked) {
    el.className = 'cromo';
    el.innerHTML = `<div class="ccover">${card.coverUrl?`<img src="${card.coverUrl}" alt="${card.name}" onerror="this.remove()">`:'<span style="font-size:30px">⚽</span>'}<span style="position:absolute;top:5px;left:5px;background:var(--success);color:#fff;font-size:9px;padding:2px 6px;border-radius:20px"><i class="ti ti-check"></i></span></div><div class="cfoot"><div style="font-size:10px;font-weight:600">${card.name}</div></div>`;
  } else if (anyOwned) {
    el.className = 'cromo';
    el.innerHTML = `<div class="ccover">${card.coverUrl?`<img src="${card.coverUrl}" alt="${card.name}" onerror="this.remove()">`:'<span style="font-size:30px">⚽</span>'}<div style="position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center"><span style="color:#fff;font-size:10px;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:20px">Ya vendido</span></div></div><div class="cfoot"><div style="font-size:10px;color:var(--text2)">${card.name}</div></div>`;
  } else {
    el.className = 'cromo locked';
    el.innerHTML = `<div class="ccover" style="background:#0a0a0a"><i class="ti ti-lock" style="font-size:24px;color:rgba(255,255,255,.18)"></i></div><div class="cfoot"><div style="font-size:11px;font-weight:700;color:var(--text2)">${cost} cr.</div></div>`;
  }
  return el;
}
function onCromoClick(card, mine) {
  if (mine) { openViewM(card); return; }
  const owned = S.users.some(u => (S.unlocked[u]||[]).includes(card.id));
  if (owned) {
    const who = S.users.find(u => (S.unlocked[u]||[]).includes(card.id)) || '?';
    document.getElementById('mbox').innerHTML = `
      ${card.coverUrl?`<img src="${card.coverUrl}" class="mcover">`:''}
      <h3>${card.name}</h3>
      <p style="font-size:12px;color:var(--danger-text)"><i class="ti ti-lock"></i> Pertenece a <strong>${who}</strong> — solo puede comprarse una vez.</p>
      <div class="mbtns"><button class="btn" onclick="closeM()">Cerrar</button></div>`;
    document.getElementById('modal').classList.add('open');
    return;
  }
  openBuyM(card);
}
let _mc = null;
function openBuyM(card) {
  _mc = card;
  const cost = catCost(card.cat); const have = cr(S.cur);
  document.getElementById('mbox').innerHTML = `
    <div style="width:100%;aspect-ratio:2/3;max-height:180px;background:#0a0a0a;border-radius:var(--r);display:flex;align-items:center;justify-content:center;margin-bottom:12px">
      <i class="ti ti-lock" style="font-size:44px;color:rgba(255,255,255,.15)"></i>
    </div>
    <h3>Cromo misterioso</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:4px">${CATS[card.cat]?.label||''}</p>
    <p style="font-size:13px;margin-bottom:4px">Coste: <strong>${cost} cr.</strong></p>
    <p style="font-size:12px;color:var(--text2)">Tienes: ${have} cr.</p>
    <div class="mbtns">
      <button class="btn" onclick="closeM()">Cancelar</button>
      ${have>=cost?`<button class="btn s" onclick="doBuy()"><i class="ti ti-lock-open"></i> Desbloquear</button>`:`<button class="btn" disabled style="opacity:.4">Sin créditos</button>`}
    </div>`;
  document.getElementById('modal').classList.add('open');
}
function doBuy() {
  if (!_mc) return;
  const cost = catCost(_mc.cat);
  if (cr(S.cur) < cost) { toast('Sin créditos'); closeM(); return; }
  if (!S.unlocked[S.cur]) S.unlocked[S.cur] = [];
  S.unlocked[S.cur].push(_mc.id);
  setCr(S.cur, cr(S.cur)-cost);
  S.history.push({user:S.cur,cardId:_mc.id,cost,ts:new Date().toLocaleTimeString(),reverted:false});
  closeM(); renderAlbum(); toast('¡Cromo desbloqueado! 🎉'); debSave();
}
function buyPack() {
  if (S.packOwned[S.cur]) { toast('Ya tienes el pack'); return; }
  if (cr(S.cur) < 10) { toast('Necesitas 10 cr.'); return; }
  const pcs = S.cards.filter(c => c.cat==='packs_basicos');
  if (!S.unlocked[S.cur]) S.unlocked[S.cur] = [];
  pcs.forEach(c => { if (!S.unlocked[S.cur].includes(c.id)) S.unlocked[S.cur].push(c.id); });
  S.packOwned[S.cur] = true; setCr(S.cur, cr(S.cur)-10);
  S.history.push({user:S.cur,cardId:'pack',cost:10,ts:new Date().toLocaleTimeString(),reverted:false,isPack:true});
  renderAlbum(); toast('¡Pack adquirido! 🎉'); debSave();
}
function openViewM(card) {
  const players = Array.isArray(card.players) ? card.players : [];
  const ph = players.length ? `<div class="mplayers">${players.map(p=>`<div class="mplayer">${p.imgUrl?`<img src="${p.imgUrl}" alt="${p.name}" onerror="this.remove()">`:'<div style="aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px">👤</div>'}<div class="mplayer-n">${p.name||''}${p.pos?' · '+p.pos:''}</div></div>`).join('')}</div>` : '';
  document.getElementById('mbox').innerHTML = `
    ${card.coverUrl?`<img src="${card.coverUrl}" class="mcover" alt="${card.name}">`:''}
    <h3>${card.name}</h3>
    <p style="font-size:12px;color:var(--success);margin-bottom:8px"><i class="ti ti-check"></i> En tu álbum · ${CATS[card.cat]?.label||''}</p>
    ${ph}
    <div class="mbtns"><button class="btn" onclick="closeM()">Cerrar</button></div>`;
  document.getElementById('modal').classList.add('open');
}

// ── APUESTAS ─────────────────────────────────────────────────────────
function renderBets() {
  buildChips('uc-bets', renderBets);
  const list = document.getElementById('matches-list'); list.innerHTML = '';
  const groups = [...new Set(S.matches.map(m=>m.g))].sort();
  groups.forEach(g => {
    const hdr = document.createElement('div');
    hdr.style.cssText = 'grid-column:1/-1;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.5px;margin-top:4px';
    hdr.textContent = 'GRUPO ' + g;
    list.appendChild(hdr);
    S.matches.filter(m=>m.g===g).forEach(m => list.appendChild(mkBetCard(m)));
  });
}
function mkBetCard(m) {
  const bkey = S.cur+'_'+m.id;
  const b    = S.bets[bkey];
  const scored = m.oh !== null && m.oa !== null;
  const div = document.createElement('div'); div.className='bc';
  let earned = '';
  if (b && scored) { const e=calcBet(b,m); if(e>0) earned=`<div style="font-size:11px;color:var(--success);text-align:right;margin-top:4px"><i class="ti ti-coin"></i> +${e} cr. ${e===3?'(exacto)':'(signo)'}</div>`; }
  if (b) {
    const sign = b.bh!==null ? (b.bh>b.ba?'1':b.bh<b.ba?'2':'X') : '–';
    div.innerHTML = `
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
        <span style="font-size:12px;font-weight:500;flex:1">${m.h} <span style="color:var(--text3)">vs</span> ${m.a}</span>
        <span class="badge bb">G${m.g}</span>
      </div>
      <div style="font-size:11px;color:var(--text2)">
        <strong style="color:var(--text)">${b.bh!==null?b.bh+' – '+b.ba:'–'}</strong>
        <span style="margin-left:5px;background:var(--accent-bg);color:var(--accent-text);padding:1px 6px;border-radius:20px;font-weight:700">${sign}</span>
        ${scored?`<span style="margin-left:5px;color:var(--success)">→ ${m.oh}–${m.oa}</span>`:''}
      </div>
      ${earned}
      ${adminOK?`<button class="cbtn" style="margin-top:6px" onclick="resetBet('${bkey}')"><i class="ti ti-edit"></i> Modificar (admin)</button>`:`<button class="cbtn done" disabled><i class="ti ti-check"></i> Enviada</button>`}`;
  } else {
    div.innerHTML = `
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <span style="font-size:12px;font-weight:500;flex:1">${m.h} <span style="color:var(--text3)">vs</span> ${m.a}</span>
        <span class="badge bb">G${m.g}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <input class="sinp" id="bh${m.id}" type="number" min="0" max="20" placeholder="0">
        <span style="font-weight:700;color:var(--text2)">–</span>
        <input class="sinp" id="ba${m.id}" type="number" min="0" max="20" placeholder="0">
        <span style="font-size:10px;color:var(--text3)">signo automático</span>
      </div>
      <button class="cbtn" onclick="confirmBet(${m.id})">Confirmar (+1 cr.)</button>`;
  }
  return div;
}
function confirmBet(mid) {
  const hv = document.getElementById('bh'+mid)?.value;
  const av = document.getElementById('ba'+mid)?.value;
  if (hv===''||hv===undefined||av===''||av===undefined) { toast('Introduce el resultado'); return; }
  const bh = parseInt(hv), ba = parseInt(av);
  S.bets[S.cur+'_'+mid] = {bh, ba, q: bh>ba?'1':bh<ba?'2':'X'};
  setCr(S.cur, cr(S.cur)+1); renderBets(); toast('+1 crédito 🪙'); debSave();
}
function resetBet(bkey) {
  if (!adminOK) { toast('Solo el admin puede modificar porras'); return; }
  if (!confirm('¿Modificar esta porra? Se revertirá el +1 cr. de confirmación.')) return;
  const user = bkey.split('_')[0];
  setCr(user, cr(user)-1);
  delete S.bets[bkey]; debSave(); renderBets(); toast('Porra eliminada');
}
function calcBet(bet, match) {
  if (match.oh===null) return 0;
  if (bet.bh===match.oh && bet.ba===match.oa) return 3;
  const off = match.oh>match.oa?'1':match.oh<match.oa?'2':'X';
  return bet.q===off ? 1 : 0;
}

// ── PLANTILLA ────────────────────────────────────────────────────────
function getAllPlayers(user) {
  const unl = S.unlocked[user] || [];
  const out = [];
  S.cards.filter(c => unl.includes(c.id)).forEach(c => {
    const ps = Array.isArray(c.players) ? c.players : [];
    if (!ps.length) out.push({cardId:c.id,idx:0,name:c.name,pos:'',img:c.coverUrl||''});
    else ps.forEach((p,i) => out.push({cardId:c.id,idx:i,name:p.name,pos:p.pos,img:p.imgUrl||c.coverUrl||''}));
  });
  return out;
}
function assignedKeys(user) {
  return new Set((S.plantilla[user]||mkPL()).filter(s=>s.cardId!=null).map(s=>s.cardId+'_'+s.idx));
}
let _slotEdit = null;
function renderPitch() {
  buildChips('uc-plantilla', renderPitch);
  const svg = document.getElementById('pitch-svg');
  svg.querySelectorAll('.pslot').forEach(s => s.remove());
  const pl  = S.plantilla[S.cur] || mkPL();
  const ak  = assignedKeys(S.cur);
  const all = getAllPlayers(S.cur);
  SLOTS.forEach(def => {
    const sd  = pl.find(s=>s.slotId===def.id) || {slotId:def.id,cardId:null,idx:0};
    const plr = sd.cardId!=null ? all.find(p=>p.cardId===sd.cardId&&p.idx===sd.idx) : null;
    const {x,y} = SVG_XY[def.id];
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','pslot');
    const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circ.setAttribute('cx',x); circ.setAttribute('cy',y); circ.setAttribute('r','24');
    circ.setAttribute('fill',plr?'#0d5c2a':'rgba(255,255,255,.13)');
    circ.setAttribute('stroke',plr?'#4ade80':'rgba(255,255,255,.3)'); circ.setAttribute('stroke-width','1.5');
    g.appendChild(circ);
    if (plr && plr.img) {
      const cpId = 'cp'+def.id;
      const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
      const cp   = document.createElementNS('http://www.w3.org/2000/svg','clipPath'); cp.setAttribute('id',cpId);
      const c2   = document.createElementNS('http://www.w3.org/2000/svg','circle'); c2.setAttribute('cx',x); c2.setAttribute('cy',y-4); c2.setAttribute('r','20');
      cp.appendChild(c2); defs.appendChild(cp); g.appendChild(defs);
      const img = document.createElementNS('http://www.w3.org/2000/svg','image');
      img.setAttribute('href',plr.img); img.setAttribute('x',x-20); img.setAttribute('y',y-24);
      img.setAttribute('width','40'); img.setAttribute('height','40');
      img.setAttribute('clip-path','url(#'+cpId+')'); img.setAttribute('preserveAspectRatio','xMidYMid slice');
      g.appendChild(img);
    }
    const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('x',x); lbl.setAttribute('y',y+(plr?13:2));
    lbl.setAttribute('text-anchor','middle'); lbl.setAttribute('font-size','8');
    lbl.setAttribute('fill', plr?'#fff':'rgba(255,255,255,.5)'); lbl.setAttribute('font-weight','600');
    lbl.textContent = plr ? plr.name.split(' ').slice(-1)[0] : def.lbl;
    g.appendChild(lbl);
    g.style.cursor = 'pointer'; g.onclick = () => openSlotM(def, sd, pl);
    svg.appendChild(g);
  });
  renderBench(ak, all);
}
function renderBench(ak, all) {
  const bench = document.getElementById('bench-grid'); bench.innerHTML = '';
  const subs  = all.filter(p => !ak.has(p.cardId+'_'+p.idx));
  if (!subs.length) { bench.innerHTML='<span style="font-size:12px;color:var(--text3)">Sin suplentes</span>'; return; }
  subs.forEach(p => {
    const el = document.createElement('div'); el.className='bp';
    el.innerHTML = `${p.img?`<img src="${p.img}" alt="${p.name}">`:'<span>👤</span>'}<span>${p.name}${p.pos?` <span style="font-size:10px;color:var(--text3)">${p.pos}</span>`:''}</span>`;
    el.onclick = () => openBenchM(p);
    bench.appendChild(el);
  });
}
function openSlotM(def, sd, pl) {
  _slotEdit = {def, sd, pl};
  const all   = getAllPlayers(S.cur);
  const compat = all.filter(p => {
    const pos = (p.pos||'').split(',').map(x=>x.trim().toUpperCase());
    return def.vp.some(vp => pos.includes(vp));
  });
  const cur = sd.cardId!=null ? all.find(p=>p.cardId===sd.cardId&&p.idx===sd.idx) : null;
  const opts = compat.length
    ? compat.map(p => {
        const isCur = cur && cur.cardId===p.cardId && cur.idx===p.idx;
        return `<div onclick="doAssign(${p.cardId},${p.idx})" style="display:flex;align-items:center;gap:8px;padding:7px;border:0.5px solid ${isCur?'var(--accent)':'var(--border)'};border-radius:var(--r);margin-bottom:5px;cursor:pointer;background:${isCur?'var(--accent-bg)':'transparent'}">
          ${p.img?`<img src="${p.img}" style="width:28px;height:28px;border-radius:50%;object-fit:cover">`:'<span>👤</span>'}
          <span style="flex:1;font-size:13px">${p.name}</span>
          <span style="font-size:10px;color:var(--text3)">${p.pos}</span>
          ${isCur?'<i class="ti ti-check" style="color:var(--success)"></i>':''}
        </div>`;
      }).join('')
    : `<p style="font-size:12px;color:var(--text2)">Sin jugadores compatibles con ${def.vp.join('/')}.</p>`;
  document.getElementById('mbox').innerHTML = `<h3>Slot ${def.lbl} (${def.id})</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Posiciones: <strong>${def.vp.join(', ')}</strong></p>
    <div style="max-height:280px;overflow-y:auto">${opts}</div>
    ${cur?`<button class="btn d" style="width:100%;margin-top:8px" onclick="clearSlot()"><i class="ti ti-user-minus"></i> Quitar</button>`:''}
    <button class="btn" style="width:100%;margin-top:6px" onclick="closeM()">Cancelar</button>`;
  document.getElementById('modal').classList.add('open');
}
function openBenchM(player) {
  const pl    = S.plantilla[S.cur] || mkPL();
  const free  = SLOTS.filter(def => {
    const slot = pl.find(s=>s.slotId===def.id);
    if (slot?.cardId!=null) return false;
    const pos = (player.pos||'').split(',').map(x=>x.trim().toUpperCase());
    return def.vp.some(vp => pos.includes(vp));
  });
  const opts = free.length
    ? free.map(def=>`<div onclick="assignBench(${player.cardId},${player.idx},'${def.id}')" style="display:flex;align-items:center;gap:8px;padding:7px;border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:5px;cursor:pointer">
        <span class="badge bb" style="font-weight:600">${def.lbl}</span>
        <span style="font-size:13px;color:var(--text2)">Slot ${def.id}</span>
      </div>`).join('')
    : '<p style="font-size:12px;color:var(--text2)">No hay slots libres compatibles.</p>';
  document.getElementById('mbox').innerHTML = `<h3>${player.name}</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Pos: <strong>${player.pos||'–'}</strong> · Asignar a slot libre:</p>
    <div style="max-height:280px;overflow-y:auto">${opts}</div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="closeM()">Cancelar</button>`;
  document.getElementById('modal').classList.add('open');
}
function doAssign(cardId, idx) {
  if (!_slotEdit) return;
  const {def,pl} = _slotEdit;
  S.plantilla[S.cur] = pl.map(s => s.slotId===def.id ? {...s,cardId,playerIdx:idx,idx} : s);
  closeM(); renderPitch(); toast('Asignado ✓'); debSave();
}
function assignBench(cardId, idx, slotId) {
  const pl = S.plantilla[S.cur] || mkPL();
  S.plantilla[S.cur] = pl.map(s => s.slotId===slotId ? {...s,cardId,playerIdx:idx,idx} : s);
  closeM(); renderPitch(); toast('Asignado ✓'); debSave();
}
function clearSlot() {
  if (!_slotEdit) return;
  const {def,pl} = _slotEdit;
  S.plantilla[S.cur] = pl.map(s => s.slotId===def.id ? {...s,cardId:null,playerIdx:0,idx:0} : s);
  closeM(); renderPitch(); toast('Retirado'); debSave();
}

// ── ADMIN: CROMOS ────────────────────────────────────────────────────
function prevCover(url, imgId) { const img=document.getElementById(imgId); if(url.trim()){img.src=url;img.style.display='block';}else img.style.display='none'; }
function initPED() { const ed=document.getElementById('ped'); if(ed){ed.innerHTML=''; addPRow('ped');} }
function addPRow(edId, name='', pos='', imgUrl='') {
  const ed  = document.getElementById(edId); if(!ed) return;
  const idx = ed.children.length;
  const row = document.createElement('div'); row.className='pe';
  row.innerHTML = `${imgUrl?`<img class="pt" src="${imgUrl}" id="pt_${edId}_${idx}">`:`<img class="pt" style="display:none" id="pt_${edId}_${idx}">`}
    <input placeholder="Nombre" value="${name}" id="pn_${edId}_${idx}" style="flex:2">
    <input placeholder="POS" value="${pos}" id="pp_${edId}_${idx}" style="width:50px;flex:none">
    <input type="url" placeholder="URL img" value="${imgUrl}" id="pi_${edId}_${idx}"
      oninput="(function(){var v=this.value,img=document.getElementById('pt_${edId}_${idx}');if(v){img.src=v;img.style.display='block';}else img.style.display='none';}).call(this)"
      style="flex:3">
    <button class="btn d" style="padding:3px 6px" onclick="this.parentElement.remove()"><i class="ti ti-trash"></i></button>`;
  ed.appendChild(row);
}
function collectP(edId) {
  const ed = document.getElementById(edId); if(!ed) return [];
  return Array.from(ed.children).map((row,i) => ({
    name: (document.getElementById('pn_'+edId+'_'+i)?.value||'').trim(),
    pos:  (document.getElementById('pp_'+edId+'_'+i)?.value||'').trim().toUpperCase(),
    imgUrl:(document.getElementById('pi_'+edId+'_'+i)?.value||'').trim()
  })).filter(p => p.name||p.imgUrl);
}
function saveCard() {
  const name = document.getElementById('cn').value.trim();
  const cat  = document.getElementById('cc').value;
  const cover= (document.getElementById('cimg')?.value||'').trim()||null;
  if (!name) { toast('Añade un título'); return; }
  S.cards.push({id:S.nextCid++, name, cat, coverUrl:cover, players:collectP('ped')});
  document.getElementById('cn').value='';
  if(document.getElementById('cimg')) document.getElementById('cimg').value='';
  document.getElementById('cprev').style.display='none';
  initPED(); renderACards(); toast('Cromo añadido ✓'); debSave();
}
function renderACards() {
  const list = document.getElementById('aclist'); list.innerHTML='';
  if (!S.cards.length) { list.innerHTML='<div class="empty">Sin cromos</div>'; return; }
  S.cards.forEach(c => {
    const owner = S.users.find(u=>(S.unlocked[u]||[]).includes(c.id));
    const ps    = Array.isArray(c.players)?c.players:[];
    const div   = document.createElement('div'); div.className='ri';
    div.innerHTML = `
      ${c.coverUrl?`<img src="${c.coverUrl}" style="width:28px;height:36px;border-radius:4px;object-fit:cover;flex-shrink:0">`:'<span style="font-size:18px">⚽</span>'}
      <span style="flex:1;min-width:0"><strong>${c.name}</strong><br><span style="font-size:10px;color:var(--text3)">${ps.map(p=>p.name||'?').join(', ')||'–'}</span></span>
      ${owner?`<span style="font-size:10px;background:var(--success-bg);color:var(--success-text);padding:2px 6px;border-radius:20px;flex-shrink:0">${owner}</span>`:''}
      <span style="font-size:11px;color:var(--text2);flex-shrink:0">${catCost(c.cat)} cr.</span>
      <button class="btn p" style="padding:3px 7px;flex-shrink:0" onclick="openEditCard(${c.id})"><i class="ti ti-edit"></i></button>
      <button class="btn d" style="padding:3px 7px;flex-shrink:0" onclick="delCard(${c.id})"><i class="ti ti-trash"></i></button>`;
    list.appendChild(div);
  });
}
function delCard(id) { S.cards=S.cards.filter(c=>c.id!==id); renderACards(); debSave(); }
function openEditCard(id) {
  const c = S.cards.find(x=>x.id===id); if(!c) return;
  const ps = Array.isArray(c.players)?c.players:[];
  const edId = 'eped'+id;
  const pRows = ps.map((_,i) => `<div class="pe" id="erow${id}_${i}">
    <img class="pt" ${ps[i].imgUrl?`src="${ps[i].imgUrl}"`:'style="display:none"'} id="pt_${edId}_${i}">
    <input placeholder="Nombre" value="${ps[i].name||''}" id="pn_${edId}_${i}" style="flex:2">
    <input placeholder="POS" value="${ps[i].pos||''}" id="pp_${edId}_${i}" style="width:50px;flex:none">
    <input type="url" placeholder="URL img" value="${ps[i].imgUrl||''}" id="pi_${edId}_${i}"
      oninput="(function(){var v=this.value,img=document.getElementById('pt_${edId}_${i}');if(v){img.src=v;img.style.display='block';}else img.style.display='none';}).call(this)" style="flex:3">
    <button class="btn d" style="padding:3px 6px" onclick="this.parentElement.remove()"><i class="ti ti-trash"></i></button>
  </div>`).join('');
  document.getElementById('mbox').innerHTML = `<h3><i class="ti ti-edit"></i> Editar cromo</h3>
    <div class="fr" style="margin-bottom:8px">
      <input id="ecn${id}" value="${c.name}" placeholder="Título">
      <select id="ecc${id}">${Object.entries(CATS).map(([k,v])=>`<option value="${k}"${k===c.cat?' selected':''}>${v.label}</option>`).join('')}</select>
    </div>
    <div class="fr" style="margin-bottom:8px">
      <input id="ecov${id}" type="url" value="${c.coverUrl||''}" placeholder="URL portada"
        oninput="prevCover(this.value,'ecprev${id}')">
    </div>
    <img id="ecprev${id}" ${c.coverUrl?`src="${c.coverUrl}"`:'style="display:none"'} style="max-height:70px;border-radius:var(--r);margin-bottom:8px;object-fit:cover">
    <div style="font-size:12px;color:var(--text2);margin-bottom:6px">Jugadores</div>
    <div id="${edId}">${pRows}</div>
    <button class="btn" style="width:100%;margin-bottom:8px" onclick="addPRow('${edId}')"><i class="ti ti-user-plus"></i> Añadir jugador</button>
    <div class="mbtns">
      <button class="btn" onclick="closeM()">Cancelar</button>
      <button class="btn p" onclick="saveEditCard(${id},'${edId}')"><i class="ti ti-check"></i> Guardar</button>
    </div>`;
  document.getElementById('modal').classList.add('open');
}
function saveEditCard(id, edId) {
  const c = S.cards.find(x=>x.id===id); if(!c) return;
  c.name    = (document.getElementById('ecn'+id)?.value||'').trim() || c.name;
  c.cat     = document.getElementById('ecc'+id)?.value || c.cat;
  c.coverUrl= (document.getElementById('ecov'+id)?.value||'').trim() || null;
  const ps  = collectP(edId); if(ps.length) c.players = ps;
  closeM(); renderACards(); renderAlbum(); toast('Cromo actualizado ✓'); debSave();
}

// ── ADMIN: BUCKET ────────────────────────────────────────────────────
const SPUB = SB_URL+'/storage/v1/object/public/'+BUCKET;
let _bitems = [];
function bpUrl(folder,name) { return `${SPUB}/${folder}/${encodeURIComponent(name)}`; }
async function listBucket() {
  const folder = document.getElementById('bfolder').value;
  if (!folder) { toast('Selecciona carpeta'); return; }
  const status = document.getElementById('bstatus');
  const grid   = document.getElementById('bgrid');
  const actions= document.getElementById('bactions');
  status.innerHTML='<i class="ti ti-loader" style="animation:spin 1s linear infinite"></i> Cargando…';
  grid.innerHTML=''; actions.style.display='none'; _bitems=[];
  try {
    const res  = await fetch(`${SB_URL}/storage/v1/object/list/${BUCKET}`, {
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({prefix:folder+'/',limit:500,offset:0,sortBy:{column:'name',order:'asc'}})
    });
    const txt  = await res.text(); let files=[];
    try { files=JSON.parse(txt); } catch(_) { files=[]; }
    if (!res.ok) throw new Error(files?.message||'HTTP '+res.status);
    const imgs = Array.isArray(files)?files.filter(f=>typeof f?.name==='string'&&/\.(jpe?g|png|webp|gif|svg)$/i.test(f.name)):[];
    if (!imgs.length) { status.textContent='Sin imágenes en "'+folder+'/"'; return; }
    _bitems = imgs.map(f => {
      const url  = bpUrl(folder,f.name);
      const name = f.name.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      return {name:String(f.name),pname:name,url,cat:folder,sel:!S.cards.some(c=>c.coverUrl===url),added:S.cards.some(c=>c.coverUrl===url)};
    });
    renderBGrid(); status.textContent=imgs.length+' imágenes en "'+folder+'/"';
  } catch(err) {
    const msg=typeof err?.message==='string'?err.message:'error';
    status.innerHTML=`<span style="color:var(--danger-text)"><i class="ti ti-alert-circle"></i> ${msg}</span>`;
  }
}
function renderBGrid() {
  const grid=document.getElementById('bgrid'); grid.innerHTML='';
  _bitems.forEach((f,i) => {
    const item=document.createElement('div'); item.className='bi'+(f.sel?' sel':'')+(f.added?' added':'');
    item.innerHTML=`<div style="position:relative"><img src="${f.url}" loading="lazy" alt="${f.pname}" onerror="this.parentElement.innerHTML='<div style=\\'width:100%;aspect-ratio:1;background:#111;display:flex;align-items:center;justify-content:center\\'>⚽</div>'">
      ${f.added?'<span style="position:absolute;top:2px;right:2px;background:var(--success);color:#fff;font-size:9px;padding:1px 4px;border-radius:20px">✓</span>':''}
      ${f.sel&&!f.added?'<span style="position:absolute;top:2px;left:2px;background:var(--accent);color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center">✓</span>':''}
    </div><div class="bi-n">${f.pname}</div>`;
    if(!f.added) item.onclick=()=>{_bitems[i].sel=!_bitems[i].sel;renderBGrid();};
    grid.appendChild(item);
  });
  const sel=_bitems.filter(f=>f.sel&&!f.added).length;
  document.getElementById('bsel').textContent=sel+' sel · '+_bitems.length+' imgs';
  document.getElementById('bactions').style.display=_bitems.length?'flex':'none';
}
function toggleSelAll() {
  const av=_bitems.filter(f=>!f.added); const all=av.every(f=>f.sel);
  av.forEach(f=>f.sel=!all); renderBGrid();
}
function importBucket() {
  const sel=_bitems.filter(f=>f.sel&&!f.added);
  if (!sel.length) { toast('Selecciona imágenes'); return; }
  sel.forEach(f => {
    S.cards.push({id:S.nextCid++,name:f.pname,cat:f.cat,coverUrl:f.url,players:[{name:f.pname,pos:'',imgUrl:f.url}]});
    f.sel=false; f.added=true;
  });
  renderBGrid(); renderACards(); debSave(); toast(sel.length+' cromos importados ✓');
}

// ── ADMIN: PARTIDOS ──────────────────────────────────────────────────
function addMatch() {
  const g=document.getElementById('mg').value.trim().toUpperCase();
  const h=document.getElementById('mh').value.trim();
  const a=document.getElementById('ma').value.trim();
  const d=document.getElementById('md').value.trim();
  if(!h||!a){toast('Rellena equipos');return;}
  S.matches.push({id:S.nextMid++,g:g||'?',h,a,date:d||'TBD',oh:null,oa:null});
  ['mg','mh','ma','md'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  renderAMatches(); debSave(); toast('Partido añadido ✓');
}
function renderAMatches() {
  const list=document.getElementById('amlist'); list.innerHTML='';
  [...new Set(S.matches.map(m=>m.g))].sort().forEach(g=>{
    const hdr=document.createElement('div');
    hdr.style.cssText='font-size:11px;font-weight:500;color:var(--text2);padding:6px 0 3px;margin-top:4px';
    hdr.textContent='Grupo '+g; list.appendChild(hdr);
    S.matches.filter(m=>m.g===g).forEach(m=>{
      const div=document.createElement('div'); div.className='ri';
      div.innerHTML=`<span style="flex:1">${m.h} vs ${m.a}</span><span style="font-size:11px;color:var(--text2)">${m.date}</span>
        ${m.oh!=null?`<span style="font-size:11px;color:var(--success)">${m.oh}–${m.oa}</span>`:''}
        <button class="btn d" style="padding:3px 7px" onclick="delMatch(${m.id})"><i class="ti ti-trash"></i></button>`;
      list.appendChild(div);
    });
  });
}
function delMatch(id) { S.matches=S.matches.filter(m=>m.id!==id); renderAMatches(); debSave(); }

// ── ADMIN: RESULTADOS ────────────────────────────────────────────────
function renderAResults() {
  const list=document.getElementById('rlist'); list.innerHTML='';
  [...new Set(S.matches.map(m=>m.g))].sort().forEach(g=>{
    const hdr=document.createElement('div');
    hdr.style.cssText='font-size:11px;font-weight:600;color:var(--text2);padding:4px 0 3px;margin-top:6px';
    hdr.textContent='GRUPO '+g; list.appendChild(hdr);
    S.matches.filter(m=>m.g===g).forEach(m=>{
      const sign=m.oh!=null?(m.oh>m.oa?'1':m.oh<m.oa?'2':'X'):'';
      const div=document.createElement('div'); div.className='ri';
      div.innerHTML=`
        <span style="flex:1;font-size:11px">${m.h} vs ${m.a}</span>
        <input id="rh${m.id}" type="number" min="0" max="30" value="${m.oh!=null?m.oh:''}" placeholder="L"
          style="width:36px;padding:3px;border:0.5px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;text-align:center;font-weight:700">
        <span style="font-weight:700">–</span>
        <input id="ra${m.id}" type="number" min="0" max="30" value="${m.oa!=null?m.oa:''}" placeholder="V"
          style="width:36px;padding:3px;border:0.5px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;text-align:center;font-weight:700">
        ${sign?`<span class="badge bb" style="font-weight:700">${sign}</span>`:'<span style="font-size:11px;color:var(--text3)">–</span>'}
        <button class="btn s" style="padding:3px 7px;font-size:11px" onclick="saveResult(${m.id})">✓</button>`;
      list.appendChild(div);
    });
  });
}
function saveResult(mid) {
  const hv=document.getElementById('rh'+mid)?.value;
  const av=document.getElementById('ra'+mid)?.value;
  if(hv===''||av==='') { toast('Introduce los goles'); return; }
  const match=S.matches.find(m=>m.id===mid);
  const prevOh=match.oh, prevOa=match.oa;
  match.oh=parseInt(hv); match.oa=parseInt(av);
  // Recalcular créditos: revertir anterior y aplicar nuevo
  S.users.forEach(u => {
    const bet=S.bets[u+'_'+mid]; if(!bet) return;
    if(prevOh!=null) { const old=calcBet(bet,{oh:prevOh,oa:prevOa}); if(old>0) setCr(u,cr(u)-old); }
    const nw=calcBet(bet,match); if(nw>0) setCr(u,cr(u)+nw);
  });
  renderAResults(); debSave();
  toast('Resultado: '+match.oh+'–'+match.oa+' ('+( match.oh>match.oa?'1':match.oh<match.oa?'2':'X')+')');
}

// ── ADMIN: USUARIOS ──────────────────────────────────────────────────
function addUser() {
  const n=document.getElementById('nuname').value.trim();
  if(!n){toast('Escribe nombre');return;}
  if(S.users.includes(n)){toast('Ya existe');return;}
  S.users.push(n); S.credits[n]=0; S.unlocked[n]=[]; S.packOwned[n]=false; S.plantilla[n]=mkPL();
  document.getElementById('nuname').value='';
  renderAUsers(); buildAllChips(); debSave(); toast('Añadido ✓');
}
function delUser(n) {
  if(!confirm('¿Eliminar a '+n+'?')) return;
  S.users=S.users.filter(u=>u!==n); if(S.cur===n) S.cur=S.users[0]||'';
  renderAUsers(); buildAllChips(); debSave(); toast(n+' eliminado');
}
function renderAUsers() {
  const list=document.getElementById('aulist'); list.innerHTML='';
  S.users.forEach(u=>{
    const div=document.createElement('div'); div.className='ri';
    div.innerHTML=`<span style="flex:1">${u}</span><span style="font-size:11px;color:var(--text2)">${cr(u)} cr.</span>
      <span style="font-size:11px;color:var(--text2)">${(S.unlocked[u]||[]).length} cromos</span>
      <button class="btn d" style="padding:3px 7px" onclick="delUser('${u}')"><i class="ti ti-trash"></i></button>`;
    list.appendChild(div);
  });
}

// ── ADMIN: REVERTIR ──────────────────────────────────────────────────
function renderRevert() {
  const list=document.getElementById('rvlist'); list.innerHTML='';
  const active=S.history.filter(h=>!h.reverted);
  if(!active.length){list.innerHTML='<div class="empty">Sin registros</div>';return;}
  [...active].reverse().forEach(h => {
    const idx=S.history.indexOf(h);
    const card=h.isPack?{name:'Pack básico'}:S.cards.find(c=>c.id===h.cardId);
    const div=document.createElement('div'); div.className='ri';
    div.innerHTML=`<span style="flex:1"><strong>${h.user}</strong> – ${card?card.name:'cromo eliminado'}</span>
      <span style="font-size:11px;color:var(--text2)">${h.cost} cr. · ${h.ts}</span>
      <button class="btn w" style="padding:3px 7px" onclick="doRevert(${idx})"><i class="ti ti-rotate-2"></i></button>`;
    list.appendChild(div);
  });
}
function doRevert(idx) {
  const h=S.history[idx]; if(!h||h.reverted) return;
  if(!confirm('¿Revertir desbloqueo de '+h.user+'?')) return;
  h.reverted=true; setCr(h.user,cr(h.user)+h.cost);
  if(h.isPack){
    S.packOwned[h.user]=false;
    const pids=S.cards.filter(c=>c.cat==='packs_basicos').map(c=>c.id);
    S.unlocked[h.user]=(S.unlocked[h.user]||[]).filter(id=>!pids.includes(id));
  } else {
    S.unlocked[h.user]=(S.unlocked[h.user]||[]).filter(id=>id!==h.cardId);
    if(S.plantilla[h.user]) S.plantilla[h.user]=S.plantilla[h.user].map(s=>s.cardId===h.cardId?{...s,cardId:null,playerIdx:0,idx:0}:s);
  }
  renderRevert(); renderAlbum(); debSave(); toast('Revertido · +'+h.cost+' cr. a '+h.user);
}

// ── BOOT ─────────────────────────────────────────────────────────────
(async () => {
  await loadState();
  startPoll();
  initPED();
})();
</script>
</body>
