// ── ADMIN AUTH ───────────────────────────────────────────────────────
function sh(s) { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%99991; return String(h); }
const AHASH = sh('8141');
let adminOK = false;

function requestAdmin() {
  if (adminOK) { showPage('admin'); return; }
  document.getElementById('mbox').innerHTML = `
    <h3><i class="ti ti-lock" style="color:var(--text2)"></i> Acceso Admin</h3>
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Contraseña de administrador</p>
    <input id="apw" type="password" placeholder="Contraseña" autofocus
      style="width:100%;padding:9px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-size:14px;font-family:var(--f);margin-bottom:6px"
      onkeydown="if(event.key==='Enter')checkPW()">
    <div id="aperr" style="font-size:11px;color:var(--danger-text);min-height:16px;margin-bottom:8px"></div>
    <div class="mbtns">
      <button class="btn" onclick="closeM()">Cancelar</button>
      <button class="btn p" onclick="checkPW()">Entrar</button>
    </div>`;
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('apw')?.focus(), 80);
}
function checkPW() {
  const v = document.getElementById('apw')?.value || '';
  if (sh(v) === AHASH) { adminOK = true; closeM(); showPage('admin'); }
  else { document.getElementById('aperr').textContent = 'Contraseña incorrecta'; document.getElementById('apw').value = ''; }
}

// ── SYNC ─────────────────────────────────────────────────────────────
function setSync(st, msg) {
  document.getElementById('sdot').className = 'sd ' + st;
  document.getElementById('slbl').textContent = msg;
  if (st === 'ok') document.getElementById('stime').textContent = new Date().toLocaleTimeString();
}
let lastTs = null, saveTO = null;

function applyV(v) {
  if (!v || typeof v !== 'object') return false;
  if (v.updated_at && v.updated_at === lastTs) return false;
  lastTs = v.updated_at || null;
  if (Array.isArray(v.users))    S.users    = v.users;
  if (v.credits  && typeof v.credits  === 'object') S.credits   = v.credits;
  if (Array.isArray(v.cards))    S.cards    = v.cards;
  if (Array.isArray(v.matches))  S.matches  = v.matches;
  if (v.bets     && typeof v.bets     === 'object') S.bets      = v.bets;
  if (v.unlocked && typeof v.unlocked === 'object') S.unlocked  = v.unlocked;
  if (v.packOwned&& typeof v.packOwned=== 'object') S.packOwned = v.packOwned;
  if (v.plantilla&& typeof v.plantilla=== 'object') S.plantilla = v.plantilla;
  if (Array.isArray(v.history))  S.history  = v.history;
  if (typeof v.nextCid === 'number') S.nextCid = v.nextCid;
  if (typeof v.nextMid === 'number') S.nextMid = v.nextMid;
  return true;
}

async function loadState() {
  setSync('ld', 'Cargando…');
  try {
    const raw = await store.get(SKEY);
    if (raw) { const v = typeof raw === 'string' ? JSON.parse(raw) : raw; applyV(v); initUsers(); setSync('ok','Cargado ✓'); }
    else { setSync('ok','Primera vez…'); await saveState(); }
  } catch(_) { setSync('ok','Iniciando…'); await saveState(); }
  buildAllChips(); updCr(); renderAlbum(); renderBets(); renderPitch(); renderACards();
}

async function saveState() {
  const p = JSON.stringify({
    users: S.users.slice(),
    credits: Object.assign({}, S.credits),
    cards: S.cards.map(c => ({id:c.id,name:c.name,cat:c.cat,coverUrl:c.coverUrl??null,
      players:Array.isArray(c.players)?c.players.map(p=>({name:String(p.name||''),pos:String(p.pos||''),imgUrl:String(p.imgUrl||'')})):[]})),
    matches: S.matches.map(m => ({id:m.id,g:m.g,h:m.h,a:m.a,date:m.date,oh:m.oh,oa:m.oa})),
    bets: Object.assign({}, S.bets),
    unlocked: Object.assign({}, S.unlocked),
    packOwned: Object.assign({}, S.packOwned),
    plantilla: JSON.parse(JSON.stringify(S.plantilla)),
    history: S.history.map(h => ({user:h.user,cardId:h.cardId,cost:h.cost,ts:h.ts,reverted:!!h.reverted,isPack:!!h.isPack})),
    nextCid: S.nextCid, nextMid: S.nextMid,
    updated_at: new Date().toISOString()
  });
  setSync('ld','Guardando…');
  try { await store.set(SKEY, p); setSync('ok','Guardado ✓'); }
  catch(e) { setSync('err','Error: '+(e?.message||'')); }
}
function debSave() { clearTimeout(saveTO); saveTO = setTimeout(saveState, 800); }

function startPoll() {
  setInterval(async () => {
    try {
      const raw = await store.get(SKEY);
      if (!raw) return;
      const v = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if (!applyV(v)) return;
      initUsers(); buildAllChips(); updCr();
      const p = document.querySelector('.page.active')?.id?.replace('page-','');
      if (p==='album')     renderAlbum();
      if (p==='apuestas')  renderBets();
      if (p==='plantilla') renderPitch();
      setSync('ok','Sincronizado ✓');
    } catch(_) {}
  }, 6000);
}

// ── HELPERS ──────────────────────────────────────────────────────────
function cr(u)  { return S.credits[u] || 0; }
function setCr(u,v) { S.credits[u] = Math.max(0,Math.round(v)); updCr(); debSave(); }
function updCr() {
  ['album','bets','plantilla'].forEach(id => {
    const el = document.getElementById('cr-'+id); if (el) el.textContent = cr(S.cur);
  });
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._t); t._t = setTimeout(() => t.style.opacity = 0, 2600);
}
function closeM() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeM(); });

// ── NAV ──────────────────────────────────────────────────────────────
function showPage(p) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(x => x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  const nb = document.getElementById('nav-'+p); if (nb) nb.classList.add('active');
  buildAllChips();
  if (p==='album')     renderAlbum();
  if (p==='apuestas')  renderBets();
  if (p==='plantilla') renderPitch();
}
function showATab(t) {
  ['cards','bucket','matches','results','users','revert'].forEach(x => {
    const el  = document.getElementById('admin-'+x); if (el)  el.style.display = x===t?'block':'none';
    const btn = document.getElementById('atab-'+x);  if (btn) btn.classList.toggle('active', x===t);
  });
  if (t==='cards')   { initPED(); renderACards(); }
  if (t==='matches') renderAMatches();
  if (t==='results') renderAResults();
  if (t==='users')   renderAUsers();
  if (t==='revert')  renderRevert();
}
function buildChips(id, cb) {
  const el = document.getElementById(id); if (!el) return;
  el.innerHTML = '';
  S.users.forEach(u => {
    const b = document.createElement('button');
    b.className = 'chip' + (u===S.cur?' active':'');
    b.textContent = u;
    b.onclick = () => { S.cur = u; updCr(); buildAllChips(); cb(); };
    el.appendChild(b);
  });
}
function buildAllChips() {
  buildChips('uc-album',     renderAlbum);
  buildChips('uc-bets',      renderBets);
  buildChips('uc-plantilla', renderPitch);
}

